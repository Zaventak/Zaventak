<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaventak</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f12;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .hero {
      max-width: 900px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 7rem);
      letter-spacing: -0.05em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.7;
      color: #b8b8c2;
      max-width: 650px;
      margin: 0 auto 32px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      background: white;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="hero">
    <h1>Zaventak</h1>

    <p>
      We design modern, high-converting websites and digital experiences
      powered by creativity, strategy, and AI.
    </p>

    <a class="button" href="#">Start a Project</a>
  </main>
</body>
</html>
